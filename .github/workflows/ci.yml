name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  docker:
    uses: mbologna/.github/.github/workflows/docker-ci.yml@b85a51a50cc1e566534b425c3275095a1b7fb58a # main
    with:
      image_name: docker-stunnel
      enable_release_drafter: true
    secrets: inherit

  auto-release:
    # Monday's schedule and a manual run release with the strategy below; a push
    # to the default branch releases only a CVE fix (the wrapper switches to the
    # security strategy). The tag build auto-release dispatches runs on the tag
    # ref, so it does not release again.
    if: >-
      github.event_name == 'schedule' ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    # contents: push the tag and create the Release; actions: dispatch this
    # workflow on it, since a tag pushed with GITHUB_TOKEN triggers no run.
    permissions:
      contents: write
      actions: write
    needs: [docker]
    uses: mbologna/.github/.github/workflows/auto-release.yml@b85a51a50cc1e566534b425c3275095a1b7fb58a # main
    with:
      strategy: conventional
      image: docker.io/mbologna/docker-stunnel
    secrets: inherit

  cache-cleanup:
    if: github.event_name == 'schedule'
    uses: mbologna/.github/.github/workflows/cache-cleanup.yml@b85a51a50cc1e566534b425c3275095a1b7fb58a # main
    with:
      max_age_days: 7
    permissions:
      actions: write
